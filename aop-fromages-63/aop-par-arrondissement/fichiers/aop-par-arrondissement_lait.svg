<svg xmlns="http://www.w3.org/2000/svg" width="720" height="723" viewBox="0 0 720 723" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" data-target="public" role="img" aria-label="Les AOP fromagères dans les cinq arrondissements. Pour le lait et la fabrication, la zone de production du Saint-Nectaire tient dans 2 arrondissements : 46 communes dans celui d’Issoire, 3 dans celui de Clermont-Ferrand."><title>Les AOP fromagères dans les cinq arrondissements</title><desc>Pour le lait et la fabrication, la zone de production du Saint-Nectaire tient dans 2 arrondissements : 46 communes dans celui d’Issoire, 3 dans celui de Clermont-Ferrand. Unité : communes de chaque arrondissement. Option : production du lait et fabrication ; seul le Saint-Nectaire change, sa zone de production compte 49 communes du département au lieu de 463 ; les cinq autres appellations n’ont qu’une aire. Périmètre : les 463 communes du Puy-de-Dôme au code officiel géographique 2025 ; 7 anciens codes de la liste INAO comptés dans leur commune actuelle, qui y figure déjà ; Sayat, comprise en partie dans l’aire du Cantal et du Salers, comptée entière. Sources : Institut national de l’origine et de la qualité (INAO), liste des communes des aires AOC et AOP (9 octobre 2025) ; INAO, aires et produits AOC, AOP et IGP (10 mars 2025) ; INAO, référentiel des produits sous signe officiel d’identification de la qualité et de l’origine (31 décembre 2025) ; INAO, cahier des charges de l’appellation Saint-Nectaire, version homologuée (6 novembre 2025) ; IGN, contours des communes ADMIN EXPRESS (2025) ; Insee, code officiel géographique (2025).</desc><rect x="0" y="0" width="720" height="723" fill="#FFFFFF"/><text x="24" y="44" font-size="20" fill="#111111"><tspan font-weight="700">Les AOP fromagères dans les cinq arrondissements</tspan></text><text x="24" y="71" font-size="14" fill="#111111"><tspan font-weight="400">Pour le lait et la fabrication, la zone de production du Saint-Nectaire tient dans </tspan><tspan font-weight="700">2</tspan><tspan font-weight="400"> arrondissements :</tspan></text><text x="24" y="91" font-size="14" fill="#111111"><tspan font-weight="700">46</tspan><tspan font-weight="400"> communes dans celui d’Issoire, </tspan><tspan font-weight="700">3</tspan><tspan font-weight="400"> dans celui de Clermont-Ferrand.</tspan></text><svg x="24" y="113" xmlns="http://www.w3.org/2000/svg" width="672" height="236" viewBox="0 0 672 236" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><text x="0" y="0" font-size="11" fill="#5F5F5F" transform="translate(261.6,98) rotate(-90)">Ambert</text><text x="0" y="0" font-size="11" fill="#5F5F5F" transform="translate(352.6,98) rotate(-90)">Clermont-Ferrand</text><text x="0" y="0" font-size="11" fill="#5F5F5F" transform="translate(443.6,98) rotate(-90)">Issoire</text><text x="0" y="0" font-size="11" fill="#5F5F5F" transform="translate(534.6,98) rotate(-90)">Riom</text><text x="0" y="0" font-size="11" fill="#5F5F5F" transform="translate(625.6,98) rotate(-90)">Thiers</text><text x="0" y="117.2" font-size="12" fill="#333333" data-fit="204.4">Saint-Nectaire (zone de production)</text><rect x="213.4" y="103" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="257.9" y="116.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="304.4" y="103" width="89" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="348.9" y="116.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">3</text><rect x="395.4" y="103" width="89" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="439.9" y="116.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">46</text><rect x="486.4" y="103" width="89" height