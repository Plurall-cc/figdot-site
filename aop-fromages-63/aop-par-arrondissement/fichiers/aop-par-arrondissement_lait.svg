 stroke="#DADADA" stroke-width="1"/><text x="348.9" y="160.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">13</text><rect x="395.4" y="147" width="89" height="20" fill="#2457A6" stroke="#DADADA" stroke-width="1"/><text x="439.9" y="160.9" font-size="11" text-anchor="middle" fill="#FFFFFF" style="font-variant-numeric:tabular-nums">66</text><rect x="486.4" y="147" width="89" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="530.9" y="160.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">48</text><rect x="577.4" y="147" width="89" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="621.9" y="160.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">22</text><text x="0" y="183.2" font-size="12" fill="#333333" data-fit="204.4">Cantal</text><rect x="213.4" y="169" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="257.9" y="182.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="304.4" y="169" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="348.9" y="182.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="395.4" y="169" width="89" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="439.9" y="182.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">24</text><rect x="486.4" y="169" width="89" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="530.9" y="182.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">1</text><rect x="577.4" y="169" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="621.9" y="182.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><text x="0" y="205.2" font-size="12" fill="#333333" data-fit="204.4">Salers</text><rect x="213.4" y="191" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="257.9" y="204.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="304.4" y="191" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="348.9" y="204.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="395.4" y="191" width="89" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="439.9" y="204.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">24</text><rect x="486.4" y="191" width="89" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="530.9" y="204.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">1</text><rect x="577.4" y="191" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="621.9" y="204.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><text x="0" y="227.2" font-size="12" fill="#333333" data-fit="204.4">Fourme de Montbrison</text><rect x="213.4" y="213" width="89" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="257.9" y="226.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">5</text><rect x="304.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="348.9" y="226.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="395.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="439.9" y="226.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="486.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="530.9" y="226.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="577.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="621.9" y="226.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text></svg><rect x="24" y="365" width="11" height="11" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="39" y="375" font-size="12" fill="#5F5F5F">aucune commune</text><rect x="156.5" y="365" width="11" height="11" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="171.5" y="375" font-size="12" fill="#5F5F5F">1 à 10</text><rect x="218.3" y="365" width="11" height="11" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="233.3" y="375" font-size="12" fill="#5F5F5F">11 à 50</text><rect x="287.3" y="365" width="11" height="11" fill="#2457A6" stroke="#DADADA" stroke-width="1"/><text x="302.3" y="375" font-size="12" fill="#5F5F5F">51 à 100</text><rect x="363.8" y="365" width="11" height="11" fill="#123366" stroke="#DADADA" stroke-width="1"/><text x="378.8" y="375" font-size="12" fill="#5F5F5F">plus de 100</text><text x="24" y="404" font-size="11" fill="#333333"><tspan font-weight="400">Nombre de communes par arrondissement : Ambert 58, Clermont-Ferrand 73, Issoire 133, Riom 155, Thiers 44.</tspan></text><text x="24" y="428" font-size="11" fill="#333333"><tspan font-weight="400">Sayat n’est comprise que pour quatre parcelles dans l’aire du Cantal et dans celle du Salers ; elle est comptée comme une</tspan></text><text x="24" y="444" font-size="11" fill="#333333"><tspan font-weight="400">commune entière, comme dans la liste de l’INAO.</tspan></text><text x="24" y="468" font-size="11" fill="#333333"><tspan font-weight="700">Unité :</tspan></text><text x="91.1" y="468" font-size="11" fill="#5F5F5F"><tspan font-weight="400">communes de chaque arrondissement</tspan></text><text x="24" y="488" font-size="11" fill="#333333"><tspan font-weight="700">Option :</tspan></text><text x="91.1" y="488" font-size="11" fill="#5F5F5F"><tspan font-weight="400">production du lait et fabrication ; seul le Saint-Nectaire change, sa zone de production compte 49 communes du</tspan></text><text x="91.1" y="504" font-size="11" fill="#5F5F5F"><tspan font-weight="400">département au lieu de 463 ; les cinq autres appellations n’ont qu’une aire</tspan></text><text x="24" y="524" font-size="11" fill="#333333"><tspan font-weight="700">Périmètre :</tspan></text><text x="91.1" y="524" font-size="11" fill="#5F5F5F"><tspan font-weight="400">les 463 communes du Puy-de-Dôme au code officiel géographique 2025 ; 7 anciens codes de la liste INAO comptés</tspan></text><text x="91.1" y="540" font-size="11" fill="#5F5F5F"><tspan font-weight="400">dans leur commune actuelle, qui y figure déjà ; Sayat, comprise en partie dans l’aire du Cantal et du Salers, comptée</tspan></text><text x="91.1" y="556" font-size="11" fill="#5F5F5F"><tspan font-weight="400">entière</tspan></text><text x="24" y="576" font-size="11" fill="#333333"><tspan font-weight="700">Sources :</tspan></text><text x="91.1" y="576" font-size="11" fill="#5F5F5F"><tspan font-weight="400">Institut national de l’origine et de la qualité (INAO), liste des communes des aires AOC et AOP (9 octobre 2025)</tspan></text><text x="91.1" y="592" font-size="11" fill="#5F5F5F"><tspan font-weight="400">INAO, aires et produits AOC, AOP et IGP (10 mars 2025)</tspan></text><text x="91.1" y="608" font-size="11" fill="#5F5F5F"><tspan font-weight="400">INAO, référentiel des produits sous signe officiel d’identification de la qualité et de l’origine (31 décembre 2025)</tspan></text><text x="91.1" y="624" font-size="11" fill="#5F5F5F"><tspan font-weight="400">INAO, cahier des charges de l’appellation Saint-Nectaire, version homologuée (6 novembre 2025)</tspan></text><text x="91.1" y="640" font-size="11" fill="#5F5F5F"><tspan font-weight="400">IGN, contours des communes ADMIN EXPRESS (2025)</tspan></text><text x="91.1" y="656" font-size="11" fill="#5F5F5F"><tspan font-weight="400">Insee, code officiel géographique (2025)</tspan></text><text x="24" y="676" font-size="11" fill="#5F5F5F"><tspan font-weight="400">Données publiques de l’INAO, de l’Insee et de l’IGN.</tspan></text><rect x="24" y="697" width="672" height="2" fill="#2457A6"/></svg>