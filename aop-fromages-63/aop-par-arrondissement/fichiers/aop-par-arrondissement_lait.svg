<svg xmlns="http://www.w3.org/2000/svg" width="720" height="722" viewBox="0 0 720 722" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" data-target="public" role="img" aria-label="Les AOP fromagères dans les cinq arrondissements. Pour le lait et la fabrication, la zone de production du Saint-Nectaire tient dans 2 arrondissements : 46 communes dans celui d’Issoire, 3 dans celui de Clermont-Ferrand."><title>Les AOP fromagères dans les cinq arrondissements</title><desc>Pour le lait et la fabrication, la zone de production du Saint-Nectaire tient dans 2 arrondissements : 46 communes dans celui d’Issoire, 3 dans celui de Clermont-Ferrand. Unité : communes de chaque arrondissement. Option : production du lait et fabrication ; seul le Saint-Nectaire change, sa zone de production compte 49 communes du département au lieu de 463 ; les cinq autres appellations n’ont qu’une aire. Périmètre : les 463 communes du Puy-de-Dôme au code officiel géographique 2025 ; 7 anciens codes de la liste INAO comptés dans leur commune actuelle, qui y figure déjà ; Sayat, comprise en partie dans l’aire du Cantal et du Salers, comptée entière. Sources : Institut national de l’origine et de la qualité (INAO), liste des communes des aires AOC et AOP (9 octobre 2025) ; INAO, aires et produits AOC, AOP et IGP (10 mars 2025) ; INAO, référentiel des produits sous signe officiel d’identification de la qualité et de l’origine (31 décembre 2025) ; INAO, cahier des charges de l’appellation Saint-Nectaire, version homologuée (6 novembre 2025) ; IGN, contours des communes ADMIN EXPRESS (2025) ; Insee, code officiel géographique (2025).</desc><rect x="0" y="0" width="720" height="722" fill="#FFFFFF"/><text x="24" y="44" font-size="20" fill="#1A2270"><tspan font-weight="700">Les AOP fromagères dans les cinq arrondissements</tspan></text><text x="24" y="70" font-size="14" fill="#0F1115"><tspan font-weight="400">Pour le lait et la fabrication, la zone de production du Saint-Nectaire tient dans </tspan><tspan font-weight="700">2</tspan><tspan font-weight="400"> arrondissements :</tspan></text><text x="24" y="90" font-size="14" fill="#0F1115"><tspan font-weight="700">46</tspan><tspan font-weight="400"> communes dans celui d’Issoire, </tspan><tspan font-weight="700">3</tspan><tspan font-weight="400"> dans celui de Clermont-Ferrand.</tspan></text><svg x="24" y="112" xmlns="http://www.w3.org/2000/svg" width="672" height="236" viewBox="0 0 672 236" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(261.6,98) rotate(-90)">Ambert</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(352.6,98) rotate(-90)">Clermont-Ferrand</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(443.6,98) rotate(-90)">Issoire</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(534.6,98) rotate(-90)">Riom</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(625.6,98) rotate(-90)">Thiers</text><text x="0" y="117.2" font-size="12" fill="#2A2D33" data-fit="204.4">Saint-Nectaire (zone de production)</text><rect x="213.4" y="103" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="257.9" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="304.4" y="103" width="89" height="20" fill="#C8D2F4" stroke="#E1E3E8" stroke-width="1"/><text x="348.9" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">3</text><rect x="395.4" y="103" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="439.9" y="116.9" font-size="11" text-anchor="middle" fill="#FFFFFF">46</text><rect x="486.4" y="103" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="530.9" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="577.4" y="103" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="621.9" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><text x="0" y="139.2" font-size="12" fill="#2A2D33" data-fit="204.4">Fourme d’Ambert</text><rect x="213.4" y="125" width="89" height="20" fill="#2638A8" stroke="#E1E3E8" stroke-width="1"/><text x="257.9" y="138.9" font-size="11" text-anchor="middle" fill="#FFFFFF">58</text><rect x="304.4" y="125" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="348.9" y="138.9" font-size="11" text-anchor="middle" fill="#FFFFFF">22</text><rect x="395.4" y="125" width="89" height="20" fill="#2638A8" stroke="#E1E3E8" stroke-width="1"/><text x="439.9" y="138.9" font-size="11" text-anchor="middle" fill="#FFFFFF">88</text><rect x="486.4" y="125" width="89" height="20" fill="#2638A8" stroke="#E1E3E8" stroke-width="1"/><text x="530.9" y="138.9" font-size="11" text-anchor="middle" fill="#FFFFFF">94</text><rect x="577.4" y="125" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="621.9" y="138.9" font-size="11" text-anchor="middle" fill="#FFFFFF">30</text><text x="0" y="161.2" font-size="12" fill="#2A2D33" data-fit="204.4">Bleu d’Auvergne</text><rect x="213.4" y="147" width="89" height="20" fill="#2638A8" stroke="#E1E3E8" stroke-width="1"/><text x="257.9" y="160.9" font-size="11" text-anchor="middle" fill="#FFFFFF">53</text><rect x="304.4" y="147" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="348.9" y="160.9" font-size="11" text-anchor="middle" fill="#FFFFFF">13</text><rect x="395.4" y="147" width="89" height="20" fill="#2638A8" stroke="#E1E3E8" stroke-width="1"/><text x="439.9" y="160.9" font-size="11" text-anchor="middle" fill="#FFFFFF">66</text><rect x="486.4" y="147" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="530.9" y="160.9" font-size="11" text-anchor="middle" fill="#FFFFFF">48</text><rect x="577.4" y="147" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="621.9" y="160.9" font-size="11" text-anchor="middle" fill="#FFFFFF">22</text><text x="0" y="183.2" font-size="12" fill="#2A2D33" data-fit="204.4">Cantal</text><rect x="213.4" y="169" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="257.9" y="182.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="304.4" y="169" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="348.9" y="182.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="395.4" y="169" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="439.9" y="182.9" font-size="11" text-anchor="middle" fill="#FFFFFF">24</text><rect x="486.4" y="169" width="89" height="20" fill="#C8D2F4" stroke="#E1E3E8" stroke-width="1"/><text x="530.9" y="182.9" font-size="11" text-anchor="middle" fill="#0F1115">1</text><rect x="577.4" y="169" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="621.9" y="182.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><text x="0" y="205.2" font-size="12" fill="#2A2D33" data-fit="204.4">Salers</text><rect x="213.4" y="191" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="257.9" y="204.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="304.4" y="191" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="348.9" y="204.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="395.4" y="191" width="89" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="439.9" y="204.9" font-size="11" text-anchor="middle" fill="#FFFFFF">24</text><rect x="486.4" y="191" width="89" height="20" fill="#C8D2F4" stroke="#E1E3E8" stroke-width="1"/><text x="530.9" y="204.9" font-size="11" text-anchor="middle" fill="#0F1115">1</text><rect x="577.4" y="191" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="621.9" y="204.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><text x="0" y="227.2" font-size="12" fill="#2A2D33" data-fit="204.4">Fourme de Montbrison</text><rect x="213.4" y="213" width="89" height="20" fill="#C8D2F4" stroke="#E1E3E8" stroke-width="1"/><text x="257.9" y="226.9" font-size="11" text-anchor="middle" fill="#0F1115">5</text><rect x="304.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="348.9" y="226.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="395.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="439.9" y="226.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="486.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="530.9" y="226.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="577.4" y="213" width="89" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="621.9" y="226.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text></svg><rect x="24" y="364" width="12" height="12" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="40" y="375" font-size="12" fill="#5A5E68">aucune commune</text><rect x="157.5" y="364" width="12" height="12" fill="#C8D2F4" stroke="#E1E3E8" stroke-width="1"/><text x="173.5" y="375" font-size="12" fill="#5A5E68">1 à 10</text><rect x="220.3" y="364" width="12" height="12" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="236.3" y="375" font-size="12" fill="#5A5E68">11 à 50</text><rect x="290.3" y="364" width="12" height="12" fill="#2638A8" stroke="#E1E3E8" stroke-width="1"/><text x="306.3" y="375" font-size="12" fill="#5A5E68">51 à 100</text><rect x="367.8" y="364" width="12" height="12" fill="#141B5C" stroke="#E1E3E8" stroke-width="1"/><text x="383.8" y="375" font-size="12" fill="#5A5E68">plus de 100</text><text x="24" y="403" font-size="11" fill="#2A2D33"><tspan font-weight="400">Nombre de communes par arrondissement : Ambert 58, Clermont-Ferrand 73, Issoire 133, Riom 155, Thiers 44.</tspan></text><text x="24" y="427" font-size="11" fill="#2A2D33"><tspan font-weight="400">Sayat n’est comprise que pour quatre parcelles dans l’aire du Cantal et dans celle du Salers ; elle est comptée comme une</tspan></text><text x="24" y="443" font-size="11" fill="#2A2D33"><tspan font-weight="400">commune entière, comme dans la liste de l’INAO.</tspan></text><text x="24" y="467" font-size="11" fill="#2A2D33"><tspan font-weight="700">Unité :</tspan></text><text x="91.1" y="467" font-size="11" fill="#5A5E68"><tspan font-weight="400">communes de chaque arrondissement</tspan></text><text x="24" y="487" font-size="11" fill="#2A2D33"><tspan font-weight="700">Option :</tspan></text><text x="91.1" y="487" font-size="11" fill="#5A5E68"><tspan font-weight="400">production du lait et fabrication ; seul le Saint-Nectaire change, sa zone de production compte 49 communes du</tspan></text><text x="91.1" y="503" font-size="11" fill="#5A5E68"><tspan font-weight="400">département au lieu de 463 ; les cinq autres appellations n’ont qu’une aire</tspan></text><text x="24" y="523" font-size="11" fill="#2A2D33"><tspan font-weight="700">Périmètre :</tspan></text><text x="91.1" y="523" font-size="11" fill="#5A5E68"><tspan font-weight="400">les 463 communes du Puy-de-Dôme au code officiel géographique 2025 ; 7 anciens codes de la liste INAO comptés</tspan></text><text x="91.1" y="539" font-size="11" fill="#5A5E68"><tspan font-weight="400">dans leur commune actuelle, qui y figure déjà ; Sayat, comprise en partie dans l’aire du Cantal et du Salers, comptée</tspan></text><text x="91.1" y="555" font-size="11" fill="#5A5E68"><tspan font-weight="400">entière</tspan></text><text x="24" y="575" font-size="11" fill="#2A2D33"><tspan font-weight="700">Sources :</tspan></text><text x="91.1" y="575" font-size="11" fill="#5A5E68"><tspan font-weight="400">Institut national de l’origine et de la qualité (INAO), liste des communes des aires AOC et AOP (9 octobre 2025)</tspan></text><text x="91.1" y="591" font-size="11" fill="#5A5E68"><tspan font-weight="400">INAO, aires et produits AOC, AOP et IGP (10 mars 2025)</tspan></text><text x="91.1" y="607" font-size="11" fill="#5A5E68"><tspan font-weight="400">INAO, référentiel des produits sous signe officiel d’identification de la qualité et de l’origine (31 décembre 2025)</tspan></text><text x="91.1" y="623" font-size="11" fill="#5A5E68"><tspan font-weight="400">INAO, cahier des charges de l’appellation Saint-Nectaire, version homologuée (6 novembre 2025)</tspan></text><text x="91.1" y="639" font-size="11" fill="#5A5E68"><tspan font-weight="400">IGN, contours des communes ADMIN EXPRESS (2025)</tspan></text><text x="91.1" y="655" font-size="11" fill="#5A5E68"><tspan font-weight="400">Insee, code officiel géographique (2025)</tspan></text><text x="24" y="675" font-size="11" fill="#5A5E68"><tspan font-weight="400">Données publiques de l’INAO, de l’Insee et de l’IGN.</tspan></text><rect x="24" y="696" width="672" height="2" fill="#442CE3"/></svg>