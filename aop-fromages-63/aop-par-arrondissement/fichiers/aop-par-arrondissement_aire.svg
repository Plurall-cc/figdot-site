e="font-variant-numeric:tabular-nums">66</text><rect x="458.9" y="69" width="105" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="511.4" y="82.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">48</text><rect x="565.9" y="69" width="105" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="618.4" y="82.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">22</text><text x="0" y="105.2" font-size="12" fill="#333333" data-fit="128.9">Cantal</text><rect x="137.9" y="91" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="190.4" y="104.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="244.9" y="91" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="297.4" y="104.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="351.9" y="91" width="105" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="404.4" y="104.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">24</text><rect x="458.9" y="91" width="105" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="511.4" y="104.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">1</text><rect x="565.9" y="91" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="618.4" y="104.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><text x="0" y="127.2" font-size="12" fill="#333333" data-fit="128.9">Salers</text><rect x="137.9" y="113" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="190.4" y="126.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="244.9" y="113" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="297.4" y="126.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="351.9" y="113" width="105" height="20" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="404.4" y="126.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">24</text><rect x="458.9" y="113" width="105" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="511.4" y="126.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">1</text><rect x="565.9" y="113" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="618.4" y="126.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><text x="0" y="149.2" font-size="12" fill="#333333" data-fit="128.9">Fourme de Montbrison</text><rect x="137.9" y="135" width="105" height="20" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="190.4" y="148.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">5</text><rect x="244.9" y="135" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="297.4" y="148.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="351.9" y="135" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="404.4" y="148.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="458.9" y="135" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="511.4" y="148.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text><rect x="565.9" y="135" width="105" height="20" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="618.4" y="148.9" font-size="11" text-anchor="middle" fill="#111111" style="font-variant-numeric:tabular-nums">0</text></svg><rect x="24" y="287" width="11" height="11" fill="#FFFFFF" stroke="#DADADA" stroke-width="1"/><text x="39" y="297" font-size="12" fill="#5F5F5F">aucune commune</text><rect x="156.5" y="287" width="11" height="11" fill="#C6D3E8" stroke="#DADADA" stroke-width="1"/><text x="171.5" y="297" font-size="12" fill="#5F5F5F">1 à 10</text><rect x="218.3" y="287" width="11" height="11" fill="#91ABD2" stroke="#DADADA" stroke-width="1"/><text x="233.3" y="297" font-size="12" fill="#5F5F5F">11 à 50</text><rect x="287.3" y="287" width="11" height="11" fill="#2457A6" stroke="#DADADA" stroke-width="1"/><text x="302.3" y="297" font-size="12" fill="#5F5F5F">51 à 100</text><rect x="363.8" y="287" width="11" height="11" fill="#123366" stroke="#DADADA" stroke-width="1"/><text x="378.8" y="297" font-size="12" fill="#5F5F5F">plus de 100</text><text x="24" y="326" font-size="11" fill="#333333"><tspan font-weight="400">Nombre de communes par arrondissement : Ambert 58, Clermont-Ferrand 73, Issoire 133, Riom 155, Thiers 44.</tspan></text><text x="24" y="350" font-size="11" fill="#333333"><tspan font-weight="400">Sayat n’est comprise que pour quatre parcelles dans l’aire du Cantal et dans celle du Salers ; elle est comptée comme une</tspan></text><text x="24" y="366" font-size="11" fill="#333333"><tspan font-weight="400">commune entière, comme dans la liste de l’INAO.</tspan></text><text x="24" y="390" font-size="11" fill="#333333"><tspan font-weight="700">Unité :</tspan></text><text x="91.1" y="390" font-size="11" fill="#5F5F5F"><tspan font-weight="400">communes de chaque arrondissement</tspan></text><text x="24" y="410" font-size="11" fill="#333333"><tspan font-weight="700">Option :</tspan></text><text x="91.1" y="410" font-size="11" fill="#5F5F5F"><tspan font-weight="400">aire géographique entière, affinage compris</tspan></text><text x="24" y="430" font-size="11" fill="#333333"><tspan font-weight="700">Périmètre :</tspan></text><text x="91.1" y="430" font-size="11" fill="#5F5F5F"><tspan font-weight="400">les 463 communes du Puy-de-Dôme au code officiel géographique 2025 ; 7 anciens codes de la liste INAO comptés</tspan></text><text x="91.1" y="446" font-size="11" fill="#5F5F5F"><tspan font-weight="400">dans leur commune actuelle, qui y figure déjà ; Sayat, comprise en partie dans l’aire du Cantal et du Salers, comptée</tspan></text><text x="91.1" y="462" font-size="11" fill="#5F5F5F"><tspan font-weight="400">entière</tspan></text><text x="24" y="482" font-size="11" fill="#333333"><tspan font-weight="700">Sources :</tspan></text><text x="91.1" y="482" font-size="11" fill="#5F5F5F"><tspan font-weight="400">Institut national de l’origine et de la qualité (INAO), liste des communes des aires AOC et AOP (9 octobre 2025)</tspan></text><text x="91.1" y="498" font-size="11" fill="#5F5F5F"><tspan font-weight="400">INAO, aires et produits AOC, AOP et IGP (10 mars 2025)</tspan></text><text x="91.1" y="514" font-size="11" fill="#5F5F5F"><tspan font-weight="400">INAO, référentiel des produits sous signe officiel d’identification de la qualité et de l’origine (31 décembre 2025)</tspan></text><text x="91.1" y="530" font-size="11" fill="#5F5F5F"><tspan font-weight="400">INAO, cahier des charges de l’appellation Saint-Nectaire, version homologuée (6 novembre 2025)</tspan></text><text x="91.1" y="546" font-size="11" fill="#5F5F5F"><tspan font-weight="400">IGN, contours des communes ADMIN EXPRESS (2025)</tspan></text><text x="91.1" y="562" font-size="11" fill="#5F5F5F"><tspan font-weight="400">Insee, code officiel géographique (2025)</tspan></text><text x="24" y="582" font-size="11" fill="#5F5F5F"><tspan font-weight="400">Données publiques de l’INAO, de l’Insee et de l’IGN.</tspan></text><rect x="24" y="603" width="672" height="2" fill="#2457A6"/></svg>