<svg xmlns="http://www.w3.org/2000/svg" width="720" height="628" viewBox="0 0 720 628" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" data-target="public" role="img" aria-label="Les AOP fromagères dans les cinq arrondissements. Affinage compris, l’aire du Saint-Nectaire s’étend aux 5 arrondissements du département ; celle de la Fourme de Montbrison ne touche que celui d’Ambert."><title>Les AOP fromagères dans les cinq arrondissements</title><desc>Affinage compris, l’aire du Saint-Nectaire s’étend aux 5 arrondissements du département ; celle de la Fourme de Montbrison ne touche que celui d’Ambert. Unité : communes de chaque arrondissement. Option : aire géographique entière, affinage compris. Périmètre : les 463 communes du Puy-de-Dôme au code officiel géographique 2025 ; 7 anciens codes de la liste INAO comptés dans leur commune actuelle, qui y figure déjà ; Sayat, comprise en partie dans l’aire du Cantal et du Salers, comptée entière. Sources : Institut national de l’origine et de la qualité (INAO), liste des communes des aires AOC et AOP (9 octobre 2025) ; INAO, aires et produits AOC, AOP et IGP (10 mars 2025) ; INAO, référentiel des produits sous signe officiel d’identification de la qualité et de l’origine (31 décembre 2025) ; INAO, cahier des charges de l’appellation Saint-Nectaire, version homologuée (6 novembre 2025) ; IGN, contours des communes ADMIN EXPRESS (2025) ; Insee, code officiel géographique (2025).</desc><rect x="0" y="0" width="720" height="628" fill="#FFFFFF"/><text x="24" y="44" font-size="20" fill="#1A2270"><tspan font-weight="700">Les AOP fromagères dans les cinq arrondissements</tspan></text><text x="24" y="70" font-size="14" fill="#0F1115"><tspan font-weight="400">Affinage compris, l’aire du Saint-Nectaire s’étend aux </tspan><tspan font-weight="700">5</tspan><tspan font-weight="400"> arrondissements du département ; celle de la</tspan></text><text x="24" y="90" fo