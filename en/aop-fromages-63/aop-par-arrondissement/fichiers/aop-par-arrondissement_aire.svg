ographic code (2025)</tspan></text><text x="24" y="549" font-size="11" fill="#5A5E68"><tspan font-weight="400">Public data from INAO, Insee and IGN.</tspan></text><rect x="24" y="570" width="672" height="2" fill="#442CE3"/></svg>