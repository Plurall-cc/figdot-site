<svg xmlns="http://www.w3.org/2000/svg" width="720" height="596" viewBox="0 0 720 596" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" data-target="public" role="img" aria-label="PDO cheeses across the five arrondissements. Ripening included, the Saint-Nectaire area reaches all 5 arrondissements of the département; the Fourme de Montbrison area only touches that of Ambert."><title>PDO cheeses across the five arrondissements</title><desc>Ripening included, the Saint-Nectaire area reaches all 5 arrondissements of the département; the Fourme de Montbrison area only touches that of Ambert. Unit: communes of each arrondissement. Option: whole geographic area, ripening included. Perimeter: the 463 communes of Puy-de-Dôme in the 2025 official geographic code; 7 former codes of the INAO list counted in their current commune, which is already listed; Sayat, partly within the Cantal and Salers area, counted whole. Sources: French National Institute of Origin and Quality (INAO), list of communes in AOC and PDO areas (2025-10-09); INAO, AOC, PDO and PGI areas and products (2025-03-10); INAO, register of products under an official quality and origin label (2025-12-31); INAO, specification of the Saint-Nectaire appellation, approved version (2025-11-06); IGN, ADMIN EXPRESS commune boundaries (2025); Insee, official geographic code (2025).</desc><rect x="0" y="0" width="720" height="596" fill="#FFFFFF"/><text x="24" y="44" font-size="20" fill="#1A2270"><tspan font-weight="700">PDO cheeses across the five arrondissements</tspan></text><text x="24" y="70" font-size="14" fill="#0F1115"><tspan font-weight="400">Ripening included, the Saint-Nectaire area reaches all </tspan><tspan font-weight="700">5</tspan><tspan font-weight="400"> arrondissements of the département; the</tspan></text><text x="24" y="90" font-size="14" fill="#0F1115"><tspan font-weight="400">Fourme de Montbrison area only touches that of Ambe