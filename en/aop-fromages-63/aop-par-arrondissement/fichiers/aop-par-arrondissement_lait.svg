ght="400">INAO, register of products under an official quality and origin label (2025-12-31)</tspan></text><text x="88.5" y="591" font-size="11" fill="#5A5E68"><tspan font-weight="400">INAO, specification of the Saint-Nectaire appellation, approved version (2025-11-06)</tspan></text><text x="88.5" y="607" font-size="11" fill="#5A5E68"><tspan font-weight="400">IGN, ADMIN EXPRESS commune boundaries (2025)</tspan></text><text x="88.5" y="623" font-size="11" fill="#5A5E68"><tspan font-weight="400">Insee, official geographic code (2025)</tspan></text><text x="24" y="643" font-size="11" fill="#5A5E68"><tspan font-weight="400">Public data from INAO, Insee and IGN.</tspan></text><rect x="24" y="664" width="672" height="2" fill="#442CE3"/></svg>