<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" data-target="public" role="img" aria-label="PDO cheeses across the five arrondissements. For milk and cheese-making, the Saint-Nectaire production zone fits in 2 arrondissements: 46 communes in that of Issoire, 3 in that of Clermont-Ferrand."><title>PDO cheeses across the five arrondissements</title><desc>For milk and cheese-making, the Saint-Nectaire production zone fits in 2 arrondissements: 46 communes in that of Issoire, 3 in that of Clermont-Ferrand. Unit: communes of each arrondissement. Option: milk production and cheese-making; only Saint-Nectaire changes, its production zone covers 49 communes of the département instead of 463; the other five appellations have a single area. Perimeter: the 463 communes of Puy-de-Dôme in the 2025 official geographic code; 7 former codes of the INAO list counted in their current commune, which is already listed; Sayat, partly within the Cantal and Salers area, counted whole. Sources: French National Institute of Origin and Quality (INAO), list of communes in AOC and PDO areas (2025-10-09); INAO, AOC, PDO and PGI areas and products (2025-03-10); INAO, register of products under an official quality and origin label (2025-12-31); INAO, specification of the Saint-Nectaire appellation, approved version (2025-11-06); IGN, ADMIN EXPRESS commune boundaries (2025); Insee, official geographic code (2025).</desc><rect x="0" y="0" width="720" height="690" fill="#FFFFFF"/><text x="24" y="44" font-size="20" fill="#1A2270"><tspan font-weight="700">PDO cheeses across the five arrondissements</tspan></text><text x="24" y="70" font-size="14" fill="#0F1115"><tspan font-weight="400">For milk and cheese-making, the Saint-Nectaire production zone fits in </tspan><tspan font-weight="700">2</tspan><tspan font-weight="400"> arrondissements: </tspan><tspan font-weight="700">46</tspan></text><text x="24" y="90" font-size="14" fill="#0F1115"><tspan font-weight="400">communes in that of Issoire, </tspan><tspan font-weight="700">3</tspan><tspan font-weight="400"> in that of Clermont-Ferrand.</tspan></text><svg x="24" y="112" xmlns="http://www.w3.org/2000/svg" width="672" height="236" viewBox="0 0 672 236" font-family="&quot;Inter&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(245.9,98) rotate(-90)">Ambert</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(340.9,98) rotate(-90)">Clermont-Ferrand</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(435.9,98) rotate(-90)">Issoire</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(530.9,98) rotate(-90)">Riom</text><text x="0" y="0" font-size="11" fill="#5A5E68" transform="translate(625.9,98) rotate(-90)">Thiers</text><text x="0" y="117.2" font-size="12" fill="#2A2D33" data-fit="186.7">Saint-Nectaire (production zone)</text><rect x="195.7" y="103" width="93" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="242.2" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="290.7" y="103" width="93" height="20" fill="#C8D2F4" stroke="#E1E3E8" stroke-width="1"/><text x="337.2" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">3</text><rect x="385.7" y="103" width="93" height="20" fill="#8497E3" stroke="#E1E3E8" stroke-width="1"/><text x="432.2" y="116.9" font-size="11" text-anchor="middle" fill="#FFFFFF">46</text><rect x="480.7" y="103" width="93" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="527.2" y="116.9" font-size="11" text-anchor="middle" fill="#0F1115">0</text><rect x="575.7" y="103" width="93" height="20" fill="#FFFFFF" stroke="#E1E3E8" stroke-width="1"/><text x="622.2" y="116.9" font-size="11" 